name: AskDB agent checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: askdb_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/agent-requirements.txt
      - run: python scripts/seed-postgres.py
        env:
          ASKDB_ADMIN_DSN: postgresql://postgres:ci-test-only@localhost:5432/askdb_test
      - run: PYTHONPATH=backend python -m pytest agent_tests backend/tests -q
        env:
          ASKDB_TEST_DSN: postgresql://askdb_reader:ci-test-only@localhost:5432/askdb_test
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
